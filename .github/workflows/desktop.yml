name: ASTRA · Desktop & Web Release
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'desktop/**'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
      - name: Echte Dokumentationsaufnahmen erstellen
        run: node scripts/gallery.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: astra-gallery
          path: docs/gallery/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-quality
          path: test-results/
          if-no-files-found: ignore
  desktop:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Native Desktop-App prüfen
        run: node tests/desktop.cjs
      - name: Windows Setup und portable EXE
        if: runner.os == 'Windows'
        run: npm run dist:win
        working-directory: desktop
      - name: macOS Universal-DMG
        if: runner.os == 'macOS'
        run: npm run dist:mac
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-quality-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
  release:
    if: github.event_name != 'pull_request'
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Version und Web-Paket
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import pathlib,zipfile,json
          version=json.loads(pathlib.Path('desktop/package.json').read_text())['version']
          with zipfile.ZipFile(f'release-assets/ASTRA-{version}-Web.zip','w',zipfile.ZIP_DEFLATED) as out:
              for p in pathlib.Path('dist').rglob('*'):
                  if p.is_file(): out.write(p,p.relative_to('dist'))
              for name in ['LICENSE','NOTICE.md']: out.write(name,name)
          PY
          (cd release-assets && sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt)
      - name: Geprüfte Downloads veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ASTRA ${{ steps.version.outputs.version }} · DGKN@Labs
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            ## ASTRA · Das Universum in 3D
            - Windows: Setup oder portable EXE (x64)
            - macOS: Universal-DMG (Intel + Apple Silicon)
            - Web: statisches ZIP für die eigene Domain, kein Build nötig

            Enthält das Sonnensystem mit JPL-Bahnen (1800–2050), elf Himmelskörper mit innerem Aufbau,
            5.080 Sterne und 88 Sternbilder für jeden Ort sowie vier animierte Himmelsphänomene.
            Daten, Texturen und Bibliotheken werden lokal mitgeliefert.

            Desktop-Pakete sind nicht mit einem kommerziellen Herausgeberzertifikat signiert
            und auf macOS nicht notarisiert. Betriebssysteme können deshalb Warnungen anzeigen.
            SHA256-Prüfsummen liegen bei. Quellen, Lizenzen und Modellgrenzen: NOTICE.md.

