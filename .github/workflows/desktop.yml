name: ASTRA · Desktop & Web Release
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'desktop/**'
      - 'tests/**'
      - 'scripts/**'
      - 'docs/release-notes.md'
      - 'package*.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: astra-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/prepare_textures.py --verify
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
      - name: HiDPI-Darstellung und Beschriftungen prüfen
        run: node tests/visual.cjs
      - name: Echte Dokumentationsaufnahmen erstellen
        run: node scripts/gallery.cjs
      - name: Geprüfte Screenshots als Git-Dateien bereitstellen
        if: github.event_name != 'pull_request'
        run: node scripts/stage_gallery.cjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: astra-gallery
          path: docs/gallery/*.png
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: browser-quality
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
  prepare:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Release-Entwurf vorbereiten
        run: node scripts/release.cjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
  desktop:
    needs: [quality, prepare]
    if: always() && needs.quality.result == 'success' && (github.event_name == 'pull_request' || needs.prepare.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Native Desktop-App prüfen
        run: node tests/desktop.cjs
      - name: Windows Setup und portable EXE
        if: runner.os == 'Windows'
        run: npm run dist:win
        working-directory: desktop
      - name: macOS Universal-DMG
        if: runner.os == 'macOS'
        run: npm run dist:mac
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Geprüfte Installer direkt im Entwurf ablegen
        if: github.event_name != 'pull_request'
        run: node scripts/release.cjs upload
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: desktop-quality-${{ runner.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
  release:
    if: github.event_name != 'pull_request'
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build-Nachweise vergleichen und vollständiges Release veröffentlichen
        run: node scripts/release.cjs publish
        env:
          GH_TOKEN: ${{ github.token }}
